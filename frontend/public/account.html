<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="referrer" content="no-referrer" />
	<title>水楼账号 · Copperfield</title>
	<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
	<link rel="stylesheet" href="/styles.css" />
	<script type="module" src="/account.js"></script>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="/"><img class="brand-mark" src="/gray-raven.png" width="38" height="38" alt="" /><span>返回水楼</span></a>
	</header>
	<main class="account-page">
		<section class="board">
			<p class="eyebrow">COPPERFIELD ／ ACCOUNT</p>
			<h1 id="title">水楼账号</h1>
			<p role="status" id="status">正在读取账号…</p>
			<button type="button" id="qq" hidden>用 QQ 登录 / 注册</button>
			<details id="email-alternative" hidden>
				<summary>改用邮箱密码注册 / 登录</summary>
				<form id="email-form" method="post">
					<p>邮箱注册会创建独立账号，不会带入 QQ 账号的评论和资料。</p>
					<fieldset aria-label="邮箱账号">
						<label>邮箱<input name="email" type="email" required maxlength="254" autocomplete="username" /></label>
						<label>密码<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 个字符" /></label>
						<label hidden>两步验证码<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" disabled /></label>
						<button type="submit">注册邮箱账号</button>
						<button type="button" id="email-switch">已有账号？去登录</button>
					</fieldset>
					<p role="status" id="email-status"></p>
				</form>
			</details>
			<form id="profile" hidden>
				<img id="avatar-preview" alt="当前头像" width="72" height="72" hidden />
				<label>更换头像<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" /></label>
				<small>支持 JPG、PNG、WebP（不超过 10 MiB），居中裁成方形，保存后生效。</small>
				<label>昵称<input name="nick" required maxlength="255" autocomplete="nickname" /></label>
				<label>个人主页（选填）<input name="homepage" type="url" placeholder="https://" maxlength="1024" /></label>
				<button type="submit">保存资料</button>
			</form>
		</section>
	</main>
</body>
</html>
